[workspace]
members = ["crates/tfy-core", "crates/tfy-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/rtk-ai/tfy"

[workspace.dependencies]
criterion = "0.7"
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.20"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tree-sitter = "0.25"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
